# Settings for the Cuckoo login screen.
# The look lives in regreet.css, this file only holds the behaviour.

# Ask for the password right away, without picking user or session.
skip_selection = true

[background]
path = "/usr/share/backgrounds/cuckoo/cuckoo.png"
fit = "Cover"

[appearance]
greeting_msg = ""

[GTK]
application_prefer_dark_theme = true

# Time and date. Language and time zone come from the system.
[widget.clock]
format = "%H:%M  ·  %a %d %b"
resolution = "30s"
label_width = 180
