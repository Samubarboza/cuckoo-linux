#
# /etc/pacman.conf for the live system.
# Only the offline repo is active, so the install never goes to the internet.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# The packages travel inside the ISO. TrustAll because they are sealed in the medium.
[cuckoo-offline]
SigLevel = Optional TrustAll
Server = file:///usr/local/share/cuckoo/offline-repo
