# Idle and sleep settings for Cuckoo Linux: lock, screen off and suspend.

general {
    # Open the lock screen only if it is not open yet
    lock_cmd = pidof hyprlock || hyprlock
    # Lock before every sleep: the lid, the idle timer or a manual suspend
    before_sleep_cmd = loginctl lock-session
    # Turn the screen on after sleep, so one key is enough
    after_sleep_cmd = hyprctl dispatch dpms on
    # Wait for the lock screen before sleep, so the desktop never shows when the lid opens
    inhibit_sleep = 3
}

# 5 min without use: lock the screen
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 30 s later: turn the screen off, and on again with any key or mouse move
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
