# Lock screen for Cuckoo Linux, with the look of the login screen.

# The same fonts as the bar and the login screen
$font = Adwaita Sans
$icon_font = JetBrainsMono Nerd Font Propo

general {
    # An empty Enter is not a wrong password
    ignore_empty_input = true
}

# Soft fade in and out, 300ms with ease-out like the login screen
animations {
    enabled = true
    bezier = easeOut, 0, 0, 0.58, 1
    animation = fadeIn, 1, 3, easeOut
    animation = fadeOut, 1, 3, easeOut
}

# The same background on every screen, the cuckoo linux text is part of the image
background {
    monitor =
    path = /usr/share/backgrounds/cuckoo/cuckoo-lock.png
}

# Time, big at the top
label {
    monitor =
    text = $TIME
    color = rgb(220, 227, 234)
    font_size = 90
    font_family = $font
    position = 0, 232
    halign = center
    valign = center
}

# Date under the time, in the system language and with the first letter in capital
label {
    monitor =
    text = cmd[update:60000] case "${LC_TIME:-$LANG}" in es*) date +"%A, %-d de %B" ;; *) date +"%A, %-d %B" ;; esac | sed 's/^./\u&/'
    color = rgb(110, 122, 136)
    font_size = 20
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

# Lock icon over the password box
label {
    monitor =
    text = 
    color = rgb(110, 122, 136)
    font_size = 28
    font_family = $icon_font
    position = 0, 90
    halign = center
    valign = center
}

# Password box, the same as the login screen
input-field {
    monitor =
    size = 350, 42
    rounding = 6
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.18)
    check_color = rgba(255, 255, 255, 0.18)
    inner_color = rgba(23, 30, 40, 0.55)
    font_color = rgb(220, 227, 234)
    font_family = $font
    placeholder_text = <span foreground="##6e7a88">Password</span>
    # Wrong password: soft red edge and message, like the login screen
    fail_color = rgba(227, 154, 154, 0.55)
    fail_text = <span foreground="##e39a9a">Wrong password</span>
    fade_on_empty = false
    position = 0, 8
    halign = center
    valign = center
}

# Round button inside the right side of the box, 7px from the edge.
# It only shows the way: Enter opens the session.
shape {
    monitor =
    size = 30, 30
    rounding = -1
    color = rgb(182, 196, 204)
    position = 153, 8
    halign = center
    valign = center
}

# Arrow on the button
label {
    monitor =
    text = 
    color = rgb(17, 23, 30)
    font_size = 12
    font_family = $icon_font
    position = 153, 8
    halign = center
    valign = center
}

# User name under the password box, like the login screen
label {
    monitor =
    text = $USER
    color = rgb(174, 184, 196)
    font_size = 14
    font_family = $font
    position = 0, -37
    halign = center
    valign = center
}
