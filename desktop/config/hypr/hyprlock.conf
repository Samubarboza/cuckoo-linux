# Lock screen for Cuckoo Linux, with the look of the login screen.

general {
    # An empty Enter is not a wrong password
    ignore_empty_input = true
}

# Soft fade in and out, 300ms with ease-out like the login screen
animations {
    enabled = true
    bezier = easeOut, 0, 0, 0.58, 1
    animation = fadeIn, 1, 3, easeOut
    animation = fadeOut, 1, 3, easeOut
}

# The same background on every screen, the cuckoo linux text is part of the image
background {
    monitor =
    path = /usr/share/backgrounds/cuckoo/cuckoo-lock.png
}

# Time, big at the top
label {
    monitor =
    text = $TIME
    color = rgb(220, 227, 234)
    font_size = 110
    font_family = Adwaita Sans
    position = 0, 364
    halign = center
    valign = center
}

# Date under the time, with the first letter in capital
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d de %B" | sed 's/^./\u&/'
    color = rgb(110, 122, 136)
    font_size = 24
    font_family = Adwaita Sans
    position = 0, 278
    halign = center
    valign = center
}

# Lock icon over the user name
label {
    monitor =
    text = 
    color = rgb(110, 122, 136)
    font_size = 40
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 161
    halign = center
    valign = center
}

# User name over the password box
label {
    monitor =
    text = $USER
    color = rgb(174, 184, 196)
    font_size = 26
    font_family = Adwaita Sans
    position = 0, 97
    halign = center
    valign = center
}
