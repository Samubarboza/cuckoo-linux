# Lock screen for Cuckoo Linux, with the look of the login screen.

general {
    # An empty Enter is not a wrong password
    ignore_empty_input = true
}

# Soft fade in and out, 300ms with ease-out like the login screen
animations {
    enabled = true
    bezier = easeOut, 0, 0, 0.58, 1
    animation = fadeIn, 1, 3, easeOut
    animation = fadeOut, 1, 3, easeOut
}
