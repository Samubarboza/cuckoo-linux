# Window style for Cuckoo Linux. hyprland.conf loads it, so the user settings after it still win.

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(6c7086aa)

    # Take the border with the mouse to resize, the cursor shows it
    resize_on_border = true
    extend_border_grab_area = 17
    hover_icon_on_border = true

    # Floating windows stick to each other and to the screen edge
    snap {
        enabled = true
        window_gap = 10
        monitor_gap = 0
        respect_gaps = true
        border_overlap = false
    }
}

decoration {
    rounding = 10

    # Windows show the blurred wallpaper behind them
    blur {
        enabled = true
        size = 6
        passes = 2
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # The window in use is more solid than the others
    active_opacity = 0.90
    inactive_opacity = 0.70
}
