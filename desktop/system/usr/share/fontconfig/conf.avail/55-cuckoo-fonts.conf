<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Cuckoo default fonts, for every app that does not pick its own -->
<!-- 55 comes after the user rules (50) and before the Arch ones (60), so the user still wins -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>IBM Plex Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>IBM Plex Mono</family>
    </prefer>
  </alias>
</fontconfig>
